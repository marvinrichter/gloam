# Daybook — tmux color snippet
# Generated from daybook.json — do not edit by hand
#
# Install (append):  cat daybook.conf >> ~/.tmux.conf
#         (source):  tmux source-file daybook.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#F2EEE6,fg=#1E1A14"
set -g status-left-style              "bg=#F2EEE6,fg=#6A5E4E"
set -g status-right-style             "bg=#F2EEE6,fg=#6A5E4E"
set -g status-left                    "#[fg=#284878,bold] #S #[fg=#6A5E4E,nobold]"
set -g status-right                   "#[fg=#6A5E4E] %H:%M #[fg=#284878]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#4A4030"
set -g pane-active-border-style       "fg=#284878"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#4A4030,fg=#284878"
set -g message-command-style          "bg=#4A4030,fg=#884830"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#284878,fg=#F2EEE6"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#6A5E4E"
set -g window-status-current-style    "fg=#284878,bold"
set -g window-status-bell-style       "fg=#882020,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#884830"
set -g popup-border-lines             "rounded"
