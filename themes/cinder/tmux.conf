# Cinder — tmux color snippet
# Generated from cinder.json — do not edit by hand
#
# Install (append):  cat cinder.conf >> ~/.tmux.conf
#         (source):  tmux source-file cinder.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#0D0B09,fg=#E4DCD0"
set -g status-left-style              "bg=#0D0B09,fg=#988070"
set -g status-right-style             "bg=#0D0B09,fg=#988070"
set -g status-left                    "#[fg=#C0A070,bold] #S #[fg=#988070,nobold]"
set -g status-right                   "#[fg=#988070] %H:%M #[fg=#C0A070]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#282218"
set -g pane-active-border-style       "fg=#C0A070"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#282218,fg=#C0A070"
set -g message-command-style          "bg=#282218,fg=#B08858"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#C0A070,fg=#0D0B09"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#988070"
set -g window-status-current-style    "fg=#C0A070,bold"
set -g window-status-bell-style       "fg=#D85040,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#B08858"
set -g popup-border-lines             "rounded"
