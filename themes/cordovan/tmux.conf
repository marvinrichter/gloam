# Cordovan — tmux color snippet
# Generated from cordovan.json — do not edit by hand
#
# Install (append):  cat cordovan.conf >> ~/.tmux.conf
#         (source):  tmux source-file cordovan.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#120A06,fg=#EAE0D4"
set -g status-left-style              "bg=#120A06,fg=#9A7D6A"
set -g status-right-style             "bg=#120A06,fg=#9A7D6A"
set -g status-left                    "#[fg=#C49A6A,bold] #S #[fg=#9A7D6A,nobold]"
set -g status-right                   "#[fg=#9A7D6A] %H:%M #[fg=#C49A6A]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#281810"
set -g pane-active-border-style       "fg=#C49A6A"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#281810,fg=#C49A6A"
set -g message-command-style          "bg=#281810,fg=#6B9AB8"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#C49A6A,fg=#120A06"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#9A7D6A"
set -g window-status-current-style    "fg=#C49A6A,bold"
set -g window-status-bell-style       "fg=#D06060,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#6B9AB8"
set -g popup-border-lines             "rounded"
