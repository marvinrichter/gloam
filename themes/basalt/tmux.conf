# Basalt — tmux color snippet
# Generated from basalt.json — do not edit by hand
#
# Install (append):  cat basalt.conf >> ~/.tmux.conf
#         (source):  tmux source-file basalt.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#090A0B,fg=#E0E4E8"
set -g status-left-style              "bg=#090A0B,fg=#7888A0"
set -g status-right-style             "bg=#090A0B,fg=#7888A0"
set -g status-left                    "#[fg=#40D8D8,bold] #S #[fg=#7888A0,nobold]"
set -g status-right                   "#[fg=#7888A0] %H:%M #[fg=#40D8D8]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#181A20"
set -g pane-active-border-style       "fg=#40D8D8"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#181A20,fg=#40D8D8"
set -g message-command-style          "bg=#181A20,fg=#E8B040"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#40D8D8,fg=#090A0B"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#7888A0"
set -g window-status-current-style    "fg=#40D8D8,bold"
set -g window-status-bell-style       "fg=#E05858,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#E8B040"
set -g popup-border-lines             "rounded"
