# Lapis — tmux color snippet
# Generated from lapis.json — do not edit by hand
#
# Install (append):  cat lapis.conf >> ~/.tmux.conf
#         (source):  tmux source-file lapis.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#060810,fg=#D0D8F0"
set -g status-left-style              "bg=#060810,fg=#6878A8"
set -g status-right-style             "bg=#060810,fg=#6878A8"
set -g status-left                    "#[fg=#5078F0,bold] #S #[fg=#6878A8,nobold]"
set -g status-right                   "#[fg=#6878A8] %H:%M #[fg=#5078F0]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#151C38"
set -g pane-active-border-style       "fg=#5078F0"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#151C38,fg=#5078F0"
set -g message-command-style          "bg=#151C38,fg=#6090FF"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#5078F0,fg=#060810"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#6878A8"
set -g window-status-current-style    "fg=#5078F0,bold"
set -g window-status-bell-style       "fg=#E84040,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#6090FF"
set -g popup-border-lines             "rounded"
