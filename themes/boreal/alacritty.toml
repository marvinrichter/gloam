# boreal — Alacritty color theme
# Generated from boreal.json — do not edit by hand
#
# Install: copy this file to ~/.config/alacritty/themes/boreal.toml
# then add `import = ["~/.config/alacritty/themes/boreal.toml"]` to alacritty.toml

[colors.primary]
background = "#060A10"
foreground = "#C8D8E8"

[colors.cursor]
cursor = "#18A8C8"
text   = "#060A10"

[colors.selection]
background = "#102030"
text       = "#C8D8E8"

[colors.normal]
black   = "#0C1218"
red     = "#C05868"
green   = "#38A890"
yellow  = "#88A8C0"
blue    = "#4878C0"
magenta = "#7070C8"
cyan    = "#18A8C8"
white   = "#7898A8"

[colors.bright]
black   = "#182838"
red     = "#D87888"
green   = "#50C8B0"
yellow  = "#A8C8E0"
blue    = "#5898E0"
magenta = "#8888D8"
cyan    = "#40D0E0"
white   = "#E0EEF8"
