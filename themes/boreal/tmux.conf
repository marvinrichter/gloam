# Boreal — tmux color snippet
# Generated from boreal.json — do not edit by hand
#
# Install (append):  cat boreal.conf >> ~/.tmux.conf
#         (source):  tmux source-file boreal.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#060A10,fg=#C8D8E8"
set -g status-left-style              "bg=#060A10,fg=#5890A0"
set -g status-right-style             "bg=#060A10,fg=#5890A0"
set -g status-left                    "#[fg=#18A8C8,bold] #S #[fg=#5890A0,nobold]"
set -g status-right                   "#[fg=#5890A0] %H:%M #[fg=#18A8C8]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#182838"
set -g pane-active-border-style       "fg=#18A8C8"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#182838,fg=#18A8C8"
set -g message-command-style          "bg=#182838,fg=#40D0E0"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#18A8C8,fg=#060A10"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#5890A0"
set -g window-status-current-style    "fg=#18A8C8,bold"
set -g window-status-bell-style       "fg=#C05868,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#40D0E0"
set -g popup-border-lines             "rounded"
