# Amethyst — tmux color snippet
# Generated from amethyst.json — do not edit by hand
#
# Install (append):  cat amethyst.conf >> ~/.tmux.conf
#         (source):  tmux source-file amethyst.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#0C0811,fg=#EAD8F8"
set -g status-left-style              "bg=#0C0811,fg=#9080A8"
set -g status-right-style             "bg=#0C0811,fg=#9080A8"
set -g status-left                    "#[fg=#C084F0,bold] #S #[fg=#9080A8,nobold]"
set -g status-right                   "#[fg=#9080A8] %H:%M #[fg=#C084F0]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#201428"
set -g pane-active-border-style       "fg=#C084F0"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#201428,fg=#C084F0"
set -g message-command-style          "bg=#201428,fg=#E8B84A"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#C084F0,fg=#0C0811"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#9080A8"
set -g window-status-current-style    "fg=#C084F0,bold"
set -g window-status-bell-style       "fg=#E05858,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#E8B84A"
set -g popup-border-lines             "rounded"
