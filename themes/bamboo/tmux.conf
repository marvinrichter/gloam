# Bamboo — tmux color snippet
# Generated from bamboo.json — do not edit by hand
#
# Install (append):  cat bamboo.conf >> ~/.tmux.conf
#         (source):  tmux source-file bamboo.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#090C08,fg=#E0DDD4"
set -g status-left-style              "bg=#090C08,fg=#888A90"
set -g status-right-style             "bg=#090C08,fg=#888A90"
set -g status-left                    "#[fg=#E06848,bold] #S #[fg=#888A90,nobold]"
set -g status-right                   "#[fg=#888A90] %H:%M #[fg=#E06848]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#182018"
set -g pane-active-border-style       "fg=#E06848"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#182018,fg=#E06848"
set -g message-command-style          "bg=#182018,fg=#80B8A0"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#E06848,fg=#090C08"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#888A90"
set -g window-status-current-style    "fg=#E06848,bold"
set -g window-status-bell-style       "fg=#C86868,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#80B8A0"
set -g popup-border-lines             "rounded"
