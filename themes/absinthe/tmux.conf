# Absinthe — tmux color snippet
# Generated from absinthe.json — do not edit by hand
#
# Install (append):  cat absinthe.conf >> ~/.tmux.conf
#         (source):  tmux source-file absinthe.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#080D0A,fg=#D8E8D4"
set -g status-left-style              "bg=#080D0A,fg=#7A8A7A"
set -g status-right-style             "bg=#080D0A,fg=#7A8A7A"
set -g status-left                    "#[fg=#70E0A0,bold] #S #[fg=#7A8A7A,nobold]"
set -g status-right                   "#[fg=#7A8A7A] %H:%M #[fg=#70E0A0]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#182018"
set -g pane-active-border-style       "fg=#70E0A0"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#182018,fg=#70E0A0"
set -g message-command-style          "bg=#182018,fg=#E8C848"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#70E0A0,fg=#080D0A"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#7A8A7A"
set -g window-status-current-style    "fg=#70E0A0,bold"
set -g window-status-bell-style       "fg=#E05858,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#E8C848"
set -g popup-border-lines             "rounded"
