# absinthe — Alacritty color theme
# Generated from absinthe.json — do not edit by hand
#
# Install: copy this file to ~/.config/alacritty/themes/absinthe.toml
# then add `import = ["~/.config/alacritty/themes/absinthe.toml"]` to alacritty.toml

[colors.primary]
background = "#080D0A"
foreground = "#D8E8D4"

[colors.cursor]
