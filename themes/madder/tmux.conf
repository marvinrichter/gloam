# Madder — tmux color snippet
# Generated from madder.json — do not edit by hand
#
# Install (append):  cat madder.conf >> ~/.tmux.conf
#         (source):  tmux source-file madder.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#0E0608,fg=#F0E0E8"
set -g status-left-style              "bg=#0E0608,fg=#B08098"
set -g status-right-style             "bg=#0E0608,fg=#B08098"
set -g status-left                    "#[fg=#E04060,bold] #S #[fg=#B08098,nobold]"
set -g status-right                   "#[fg=#B08098] %H:%M #[fg=#E04060]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#38182A"
set -g pane-active-border-style       "fg=#E04060"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#38182A,fg=#E04060"
set -g message-command-style          "bg=#38182A,fg=#F07898"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#E04060,fg=#0E0608"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#B08098"
set -g window-status-current-style    "fg=#E04060,bold"
set -g window-status-bell-style       "fg=#E04848,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#F07898"
set -g popup-border-lines             "rounded"
