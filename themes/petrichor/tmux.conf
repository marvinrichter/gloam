# Petrichor — tmux color snippet
# Generated from petrichor.json — do not edit by hand
#
# Install (append):  cat petrichor.conf >> ~/.tmux.conf
#         (source):  tmux source-file petrichor.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#0A0C0A,fg=#D8DCCC"
set -g status-left-style              "bg=#0A0C0A,fg=#78806A"
set -g status-right-style             "bg=#0A0C0A,fg=#78806A"
set -g status-left                    "#[fg=#78C888,bold] #S #[fg=#78806A,nobold]"
set -g status-right                   "#[fg=#78806A] %H:%M #[fg=#78C888]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#181C18"
set -g pane-active-border-style       "fg=#78C888"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#181C18,fg=#78C888"
set -g message-command-style          "bg=#181C18,fg=#48B8E8"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#78C888,fg=#0A0C0A"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#78806A"
set -g window-status-current-style    "fg=#78C888,bold"
set -g window-status-bell-style       "fg=#D05858,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#48B8E8"
set -g popup-border-lines             "rounded"
