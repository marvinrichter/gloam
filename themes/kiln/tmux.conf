# Kiln — tmux color snippet
# Generated from kiln.json — do not edit by hand
#
# Install (append):  cat kiln.conf >> ~/.tmux.conf
#         (source):  tmux source-file kiln.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#100908,fg=#F2E0D0"
set -g status-left-style              "bg=#100908,fg=#A87060"
set -g status-right-style             "bg=#100908,fg=#A87060"
set -g status-left                    "#[fg=#E05830,bold] #S #[fg=#A87060,nobold]"
set -g status-right                   "#[fg=#A87060] %H:%M #[fg=#E05830]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#281410"
set -g pane-active-border-style       "fg=#E05830"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#281410,fg=#E05830"
set -g message-command-style          "bg=#281410,fg=#F08040"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#E05830,fg=#100908"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#A87060"
set -g window-status-current-style    "fg=#E05830,bold"
set -g window-status-bell-style       "fg=#DC4030,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#F08040"
set -g popup-border-lines             "rounded"
