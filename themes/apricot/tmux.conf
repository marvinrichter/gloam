# Apricot — tmux color snippet
# Generated from apricot.json — do not edit by hand
#
# Install (append):  cat apricot.conf >> ~/.tmux.conf
#         (source):  tmux source-file apricot.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#FDF6ED,fg=#200E06"
set -g status-left-style              "bg=#FDF6ED,fg=#806050"
set -g status-right-style             "bg=#FDF6ED,fg=#806050"
set -g status-left                    "#[fg=#7A5810,bold] #S #[fg=#806050,nobold]"
set -g status-right                   "#[fg=#806050] %H:%M #[fg=#7A5810]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#EDD8B8"
set -g pane-active-border-style       "fg=#7A5810"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#EDD8B8,fg=#7A5810"
set -g message-command-style          "bg=#EDD8B8,fg=#904018"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#7A5810,fg=#FDF6ED"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#806050"
set -g window-status-current-style    "fg=#7A5810,bold"
set -g window-status-bell-style       "fg=#B01818,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#904018"
set -g popup-border-lines             "rounded"
