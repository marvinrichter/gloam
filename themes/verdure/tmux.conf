# Verdure — tmux color snippet
# Generated from verdure.json — do not edit by hand
#
# Install (append):  cat verdure.conf >> ~/.tmux.conf
#         (source):  tmux source-file verdure.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#080E08,fg=#D0E0C0"
set -g status-left-style              "bg=#080E08,fg=#709048"
set -g status-right-style             "bg=#080E08,fg=#709048"
set -g status-left                    "#[fg=#60C848,bold] #S #[fg=#709048,nobold]"
set -g status-right                   "#[fg=#709048] %H:%M #[fg=#60C848]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#203020"
set -g pane-active-border-style       "fg=#60C848"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#203020,fg=#60C848"
set -g message-command-style          "bg=#203020,fg=#90E060"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#60C848,fg=#080E08"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#709048"
set -g window-status-current-style    "fg=#60C848,bold"
set -g window-status-bell-style       "fg=#D06060,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#90E060"
set -g popup-border-lines             "rounded"
