# Sable — tmux color snippet
# Generated from sable.json — do not edit by hand
#
# Install (append):  cat sable.conf >> ~/.tmux.conf
#         (source):  tmux source-file sable.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#080808,fg=#E8E8E8"
set -g status-left-style              "bg=#080808,fg=#7A8294"
set -g status-right-style             "bg=#080808,fg=#7A8294"
set -g status-left                    "#[fg=#C0C8D4,bold] #S #[fg=#7A8294,nobold]"
set -g status-right                   "#[fg=#7A8294] %H:%M #[fg=#C0C8D4]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#202020"
set -g pane-active-border-style       "fg=#C0C8D4"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#202020,fg=#C0C8D4"
set -g message-command-style          "bg=#202020,fg=#D4AA6A"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#C0C8D4,fg=#080808"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#7A8294"
set -g window-status-current-style    "fg=#C0C8D4,bold"
set -g window-status-bell-style       "fg=#D44848,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#D4AA6A"
set -g popup-border-lines             "rounded"
