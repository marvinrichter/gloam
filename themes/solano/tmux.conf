# Solano — tmux color snippet
# Generated from solano.json — do not edit by hand
#
# Install (append):  cat solano.conf >> ~/.tmux.conf
#         (source):  tmux source-file solano.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#F5EDE0,fg=#2A1C10"
set -g status-left-style              "bg=#F5EDE0,fg=#7A5C40"
set -g status-right-style             "bg=#F5EDE0,fg=#7A5C40"
set -g status-left                    "#[fg=#782010,bold] #S #[fg=#7A5C40,nobold]"
set -g status-right                   "#[fg=#7A5C40] %H:%M #[fg=#782010]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#4A3828"
set -g pane-active-border-style       "fg=#782010"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#4A3828,fg=#782010"
set -g message-command-style          "bg=#4A3828,fg=#1A4A7A"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#782010,fg=#F5EDE0"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#7A5C40"
set -g window-status-current-style    "fg=#782010,bold"
set -g window-status-bell-style       "fg=#8B1A2A,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#1A4A7A"
set -g popup-border-lines             "rounded"
