# Bloom — tmux color snippet
# Generated from bloom.json — do not edit by hand
#
# Install (append):  cat bloom.conf >> ~/.tmux.conf
#         (source):  tmux source-file bloom.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#FFF0F0,fg=#2A1420"
set -g status-left-style              "bg=#FFF0F0,fg=#7A5868"
set -g status-right-style             "bg=#FFF0F0,fg=#7A5868"
set -g status-left                    "#[fg=#7A1840,bold] #S #[fg=#7A5868,nobold]"
set -g status-right                   "#[fg=#7A5868] %H:%M #[fg=#7A1840]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#3A2030"
set -g pane-active-border-style       "fg=#7A1840"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#3A2030,fg=#7A1840"
set -g message-command-style          "bg=#3A2030,fg=#5A2080"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#7A1840,fg=#FFF0F0"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#7A5868"
set -g window-status-current-style    "fg=#7A1840,bold"
set -g window-status-bell-style       "fg=#8A1020,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#5A2080"
set -g popup-border-lines             "rounded"
