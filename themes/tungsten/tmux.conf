# Tungsten — tmux color snippet
# Generated from tungsten.json — do not edit by hand
#
# Install (append):  cat tungsten.conf >> ~/.tmux.conf
#         (source):  tmux source-file tungsten.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#0E0C09,fg=#F4EED8"
set -g status-left-style              "bg=#0E0C09,fg=#887A60"
set -g status-right-style             "bg=#0E0C09,fg=#887A60"
set -g status-left                    "#[fg=#F0D890,bold] #S #[fg=#887A60,nobold]"
set -g status-right                   "#[fg=#887A60] %H:%M #[fg=#F0D890]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#1E1A14"
set -g pane-active-border-style       "fg=#F0D890"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#1E1A14,fg=#F0D890"
set -g message-command-style          "bg=#1E1A14,fg=#5A90C8"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#F0D890,fg=#0E0C09"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#887A60"
set -g window-status-current-style    "fg=#F0D890,bold"
set -g window-status-bell-style       "fg=#E05858,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#5A90C8"
set -g popup-border-lines             "rounded"
