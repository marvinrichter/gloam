# Nocturne — tmux color snippet
# Generated from nocturne.json — do not edit by hand
#
# Install (append):  cat nocturne.conf >> ~/.tmux.conf
#         (source):  tmux source-file nocturne.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#100A0C,fg=#EEE8E0"
set -g status-left-style              "bg=#100A0C,fg=#848080"
set -g status-right-style             "bg=#100A0C,fg=#848080"
set -g status-left                    "#[fg=#E0D0A8,bold] #S #[fg=#848080,nobold]"
set -g status-right                   "#[fg=#848080] %H:%M #[fg=#E0D0A8]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#201820"
set -g pane-active-border-style       "fg=#E0D0A8"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#201820,fg=#E0D0A8"
set -g message-command-style          "bg=#201820,fg=#D05A6A"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#E0D0A8,fg=#100A0C"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#848080"
set -g window-status-current-style    "fg=#E0D0A8,bold"
set -g window-status-bell-style       "fg=#E04848,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#D05A6A"
set -g popup-border-lines             "rounded"
