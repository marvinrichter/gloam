# nocturne — Alacritty color theme
# Generated from nocturne.json — do not edit by hand
#
# Install: copy this file to ~/.config/alacritty/themes/nocturne.toml
# then add `import = ["~/.config/alacritty/themes/nocturne.toml"]` to alacritty.toml

[colors.primary]
background = "#100A0C"
foreground = "#EEE8E0"

[colors.cursor]
cursor = "#D05A6A"
text   = "#0C0A0C"

[colors.selection]
background = "#201820"
text       = "#EEE8E0"

[colors.normal]
black   = "#100A0C"
red     = "#883040"
green   = "#406840"
yellow  = "#B09040"
blue    = "#484880"
magenta = "#784878"
cyan    = "#387878"
white   = "#848080"

[colors.bright]
black   = "#201820"
red     = "#E04848"
green   = "#60B870"
yellow  = "#E0D0A8"
blue    = "#9880A0"
magenta = "#D05A6A"
cyan    = "#50A8A8"
white   = "#EEE8E0"
