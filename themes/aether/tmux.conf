# Aether — tmux color snippet
# Generated from aether.json — do not edit by hand
#
# Install (append):  cat aether.conf >> ~/.tmux.conf
#         (source):  tmux source-file aether.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#0C0B1A,fg=#D4D8F0"
set -g status-left-style              "bg=#0C0B1A,fg=#8886B0"
set -g status-right-style             "bg=#0C0B1A,fg=#8886B0"
set -g status-left                    "#[fg=#5EE8B8,bold] #S #[fg=#8886B0,nobold]"
set -g status-right                   "#[fg=#8886B0] %H:%M #[fg=#5EE8B8]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#252448"
set -g pane-active-border-style       "fg=#5EE8B8"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#252448,fg=#5EE8B8"
set -g message-command-style          "bg=#252448,fg=#C084FC"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#5EE8B8,fg=#0C0B1A"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#8886B0"
set -g window-status-current-style    "fg=#5EE8B8,bold"
set -g window-status-bell-style       "fg=#FF6B6B,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#C084FC"
set -g popup-border-lines             "rounded"
