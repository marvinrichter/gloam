# aether — Alacritty color theme
# Generated from aether.json — do not edit by hand
#
# Install: copy this file to ~/.config/alacritty/themes/aether.toml
# then add `import = ["~/.config/alacritty/themes/aether.toml"]` to alacritty.toml

[colors.primary]
background = "#0C0B1A"
foreground = "#D4D8F0"

[colors.cursor]
cursor = "#C084FC"
text   = "#0C0B1A"

[colors.selection]
background = "#1C1B3A"
text       = "#D4D8F0"

[colors.normal]
black   = "#0C0B1A"
red     = "#9B4F6C"
green   = "#4AC88A"
yellow  = "#A8B870"
blue    = "#6B5ED8"
magenta = "#B060C8"
cyan    = "#48A8CC"
white   = "#9098C0"

[colors.bright]
black   = "#252448"
red     = "#E87090"
green   = "#5EE8B8"
yellow  = "#9EE878"
blue    = "#8886B0"
magenta = "#C084FC"
cyan    = "#58C8E8"
white   = "#D4D8F0"
