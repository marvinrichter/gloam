# Dusk — tmux color snippet
# Generated from dusk.json — do not edit by hand
#
# Install (append):  cat dusk.conf >> ~/.tmux.conf
#         (source):  tmux source-file dusk.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#282834,fg=#C8C4BC"
set -g status-left-style              "bg=#282834,fg=#9098A8"
set -g status-right-style             "bg=#282834,fg=#9098A8"
set -g status-left                    "#[fg=#C490C8,bold] #S #[fg=#9098A8,nobold]"
set -g status-right                   "#[fg=#9098A8] %H:%M #[fg=#C490C8]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#3A3A48"
set -g pane-active-border-style       "fg=#C490C8"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#3A3A48,fg=#C490C8"
set -g message-command-style          "bg=#3A3A48,fg=#E8A860"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#C490C8,fg=#282834"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#9098A8"
set -g window-status-current-style    "fg=#C490C8,bold"
set -g window-status-bell-style       "fg=#DC7878,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#E8A860"
set -g popup-border-lines             "rounded"
