# Umbra — tmux color snippet
# Generated from umbra.json — do not edit by hand
#
# Install (append):  cat umbra.conf >> ~/.tmux.conf
#         (source):  tmux source-file umbra.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#070708,fg=#E4E8F0"
set -g status-left-style              "bg=#070708,fg=#728090"
set -g status-right-style             "bg=#070708,fg=#728090"
set -g status-left                    "#[fg=#A0B4C8,bold] #S #[fg=#728090,nobold]"
set -g status-right                   "#[fg=#728090] %H:%M #[fg=#A0B4C8]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#1A1C20"
set -g pane-active-border-style       "fg=#A0B4C8"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#1A1C20,fg=#A0B4C8"
set -g message-command-style          "bg=#1A1C20,fg=#8B6CF0"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#A0B4C8,fg=#070708"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#728090"
set -g window-status-current-style    "fg=#A0B4C8,bold"
set -g window-status-bell-style       "fg=#DC5858,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#8B6CF0"
set -g popup-border-lines             "rounded"
