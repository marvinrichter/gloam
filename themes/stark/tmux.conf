# Stark — tmux color snippet
# Generated from stark.json — do not edit by hand
#
# Install (append):  cat stark.conf >> ~/.tmux.conf
#         (source):  tmux source-file stark.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#FFFFFF,fg=#000000"
set -g status-left-style              "bg=#FFFFFF,fg=#3A3A3A"
set -g status-right-style             "bg=#FFFFFF,fg=#3A3A3A"
set -g status-left                    "#[fg=#001A8C,bold] #S #[fg=#3A3A3A,nobold]"
set -g status-right                   "#[fg=#3A3A3A] %H:%M #[fg=#001A8C]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#444444"
set -g pane-active-border-style       "fg=#001A8C"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#444444,fg=#001A8C"
set -g message-command-style          "bg=#444444,fg=#8C3000"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#001A8C,fg=#FFFFFF"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#3A3A3A"
set -g window-status-current-style    "fg=#001A8C,bold"
set -g window-status-bell-style       "fg=#8C0000,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#8C3000"
set -g popup-border-lines             "rounded"
