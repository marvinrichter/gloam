# Nacreous — tmux color snippet
# Generated from nacreous.json — do not edit by hand
#
# Install (append):  cat nacreous.conf >> ~/.tmux.conf
#         (source):  tmux source-file nacreous.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#0B0C10,fg=#E4E8F0"
set -g status-left-style              "bg=#0B0C10,fg=#8888A8"
set -g status-right-style             "bg=#0B0C10,fg=#8888A8"
set -g status-left                    "#[fg=#78D8C8,bold] #S #[fg=#8888A8,nobold]"
set -g status-right                   "#[fg=#8888A8] %H:%M #[fg=#78D8C8]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#1A1C28"
set -g pane-active-border-style       "fg=#78D8C8"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#1A1C28,fg=#78D8C8"
set -g message-command-style          "bg=#1A1C28,fg=#E890C8"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#78D8C8,fg=#0B0C10"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#8888A8"
set -g window-status-current-style    "fg=#78D8C8,bold"
set -g window-status-bell-style       "fg=#E06868,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#E890C8"
set -g popup-border-lines             "rounded"
