# Weld — tmux color snippet
# Generated from weld.json — do not edit by hand
#
# Install (append):  cat weld.conf >> ~/.tmux.conf
#         (source):  tmux source-file weld.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#0E0E08,fg=#E8E0C0"
set -g status-left-style              "bg=#0E0E08,fg=#909060"
set -g status-right-style             "bg=#0E0E08,fg=#909060"
set -g status-left                    "#[fg=#98B838,bold] #S #[fg=#909060,nobold]"
set -g status-right                   "#[fg=#909060] %H:%M #[fg=#98B838]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#202018"
set -g pane-active-border-style       "fg=#98B838"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#202018,fg=#98B838"
set -g message-command-style          "bg=#202018,fg=#E8B040"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#98B838,fg=#0E0E08"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#909060"
set -g window-status-current-style    "fg=#98B838,bold"
set -g window-status-bell-style       "fg=#D06060,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#E8B040"
set -g popup-border-lines             "rounded"
