# Rosewater — tmux color snippet
# Generated from rosewater.json — do not edit by hand
#
# Install (append):  cat rosewater.conf >> ~/.tmux.conf
#         (source):  tmux source-file rosewater.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#100A0F,fg=#F0E0E8"
set -g status-left-style              "bg=#100A0F,fg=#9A7890"
set -g status-right-style             "bg=#100A0F,fg=#9A7890"
set -g status-left                    "#[fg=#E868A0,bold] #S #[fg=#9A7890,nobold]"
set -g status-right                   "#[fg=#9A7890] %H:%M #[fg=#E868A0]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#2A1828"
set -g pane-active-border-style       "fg=#E868A0"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#2A1828,fg=#E868A0"
set -g message-command-style          "bg=#2A1828,fg=#C8A0D8"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#E868A0,fg=#100A0F"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#9A7890"
set -g window-status-current-style    "fg=#E868A0,bold"
set -g window-status-bell-style       "fg=#E05A5A,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#C8A0D8"
set -g popup-border-lines             "rounded"
