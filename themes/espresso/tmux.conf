# Espresso — tmux color snippet
# Generated from espresso.json — do not edit by hand
#
# Install (append):  cat espresso.conf >> ~/.tmux.conf
#         (source):  tmux source-file espresso.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#0D0906,fg=#F0E4D0"
set -g status-left-style              "bg=#0D0906,fg=#A07860"
set -g status-right-style             "bg=#0D0906,fg=#A07860"
set -g status-left                    "#[fg=#C87030,bold] #S #[fg=#A07860,nobold]"
set -g status-right                   "#[fg=#A07860] %H:%M #[fg=#C87030]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#2A1E14"
set -g pane-active-border-style       "fg=#C87030"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#2A1E14,fg=#C87030"
set -g message-command-style          "bg=#2A1E14,fg=#E89840"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#C87030,fg=#0D0906"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#A07860"
set -g window-status-current-style    "fg=#C87030,bold"
set -g window-status-bell-style       "fg=#DC4030,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#E89840"
set -g popup-border-lines             "rounded"
