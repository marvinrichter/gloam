# Ember — tmux color snippet
# Generated from ember.json — do not edit by hand
#
# Install (append):  cat ember.conf >> ~/.tmux.conf
#         (source):  tmux source-file ember.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#111008,fg=#F5EDD4"
set -g status-left-style              "bg=#111008,fg=#9E8E78"
set -g status-right-style             "bg=#111008,fg=#9E8E78"
set -g status-left                    "#[fg=#FFAB40,bold] #S #[fg=#9E8E78,nobold]"
set -g status-right                   "#[fg=#9E8E78] %H:%M #[fg=#FFAB40]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#282418"
set -g pane-active-border-style       "fg=#FFAB40"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#282418,fg=#FFAB40"
set -g message-command-style          "bg=#282418,fg=#FF6D00"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#FFAB40,fg=#111008"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#9E8E78"
set -g window-status-current-style    "fg=#FFAB40,bold"
set -g window-status-bell-style       "fg=#FF4040,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#FF6D00"
set -g popup-border-lines             "rounded"
