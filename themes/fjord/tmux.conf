# Fjord — tmux color snippet
# Generated from fjord.json — do not edit by hand
#
# Install (append):  cat fjord.conf >> ~/.tmux.conf
#         (source):  tmux source-file fjord.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#0A0F18,fg=#D4E0E8"
set -g status-left-style              "bg=#0A0F18,fg=#688EAA"
set -g status-right-style             "bg=#0A0F18,fg=#688EAA"
set -g status-left                    "#[fg=#6EB5E0,bold] #S #[fg=#688EAA,nobold]"
set -g status-right                   "#[fg=#688EAA] %H:%M #[fg=#6EB5E0]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#1E2A38"
set -g pane-active-border-style       "fg=#6EB5E0"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#1E2A38,fg=#6EB5E0"
set -g message-command-style          "bg=#1E2A38,fg=#E8C46A"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#6EB5E0,fg=#0A0F18"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#688EAA"
set -g window-status-current-style    "fg=#6EB5E0,bold"
set -g window-status-bell-style       "fg=#E06060,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#E8C46A"
set -g popup-border-lines             "rounded"
