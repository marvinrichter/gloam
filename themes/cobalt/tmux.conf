# Cobalt — tmux color snippet
# Generated from cobalt.json — do not edit by hand
#
# Install (append):  cat cobalt.conf >> ~/.tmux.conf
#         (source):  tmux source-file cobalt.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#080C18,fg=#D8E0F0"
set -g status-left-style              "bg=#080C18,fg=#7888B8"
set -g status-right-style             "bg=#080C18,fg=#7888B8"
set -g status-left                    "#[fg=#6878F0,bold] #S #[fg=#7888B8,nobold]"
set -g status-right                   "#[fg=#7888B8] %H:%M #[fg=#6878F0]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#182038"
set -g pane-active-border-style       "fg=#6878F0"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#182038,fg=#6878F0"
set -g message-command-style          "bg=#182038,fg=#70D8F0"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#6878F0,fg=#080C18"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#7888B8"
set -g window-status-current-style    "fg=#6878F0,bold"
set -g window-status-bell-style       "fg=#D05860,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#70D8F0"
set -g popup-border-lines             "rounded"
