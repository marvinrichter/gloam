# Eventide — tmux color snippet
# Generated from eventide.json — do not edit by hand
#
# Install (append):  cat eventide.conf >> ~/.tmux.conf
#         (source):  tmux source-file eventide.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#0D0F1A,fg=#F0EAD6"
set -g status-left-style              "bg=#0D0F1A,fg=#8B84C4"
set -g status-right-style             "bg=#0D0F1A,fg=#8B84C4"
set -g status-left                    "#[fg=#E8B86D,bold] #S #[fg=#8B84C4,nobold]"
set -g status-right                   "#[fg=#8B84C4] %H:%M #[fg=#E8B86D]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#2A2D3E"
set -g pane-active-border-style       "fg=#E8B86D"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#2A2D3E,fg=#E8B86D"
set -g message-command-style          "bg=#2A2D3E,fg=#FF7F57"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#E8B86D,fg=#0D0F1A"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#8B84C4"
set -g window-status-current-style    "fg=#E8B86D,bold"
set -g window-status-bell-style       "fg=#E85D5D,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#FF7F57"
set -g popup-border-lines             "rounded"
