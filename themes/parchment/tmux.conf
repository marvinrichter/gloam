# Parchment — tmux color snippet
# Generated from parchment.json — do not edit by hand
#
# Install (append):  cat parchment.conf >> ~/.tmux.conf
#         (source):  tmux source-file parchment.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#E8D6B4,fg=#2A1E12"
set -g status-left-style              "bg=#E8D6B4,fg=#6B5A48"
set -g status-right-style             "bg=#E8D6B4,fg=#6B5A48"
set -g status-left                    "#[fg=#4A2E12,bold] #S #[fg=#6B5A48,nobold]"
set -g status-right                   "#[fg=#6B5A48] %H:%M #[fg=#4A2E12]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#4A3828"
set -g pane-active-border-style       "fg=#4A2E12"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#4A3828,fg=#4A2E12"
set -g message-command-style          "bg=#4A3828,fg=#7A3A10"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#4A2E12,fg=#E8D6B4"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#6B5A48"
set -g window-status-current-style    "fg=#4A2E12,bold"
set -g window-status-bell-style       "fg=#8B2020,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#7A3A10"
set -g popup-border-lines             "rounded"
