# Phosphor — tmux color snippet
# Generated from phosphor.json — do not edit by hand
#
# Install (append):  cat phosphor.conf >> ~/.tmux.conf
#         (source):  tmux source-file phosphor.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#040804,fg=#C0E8B8"
set -g status-left-style              "bg=#040804,fg=#50A860"
set -g status-right-style             "bg=#040804,fg=#50A860"
set -g status-left                    "#[fg=#00D848,bold] #S #[fg=#50A860,nobold]"
set -g status-right                   "#[fg=#50A860] %H:%M #[fg=#00D848]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#182818"
set -g pane-active-border-style       "fg=#00D848"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#182818,fg=#00D848"
set -g message-command-style          "bg=#182818,fg=#40FF80"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#00D848,fg=#040804"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#50A860"
set -g window-status-current-style    "fg=#00D848,bold"
set -g window-status-bell-style       "fg=#FF4040,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#40FF80"
set -g popup-border-lines             "rounded"
