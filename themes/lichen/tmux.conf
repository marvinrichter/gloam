# Lichen — tmux color snippet
# Generated from lichen.json — do not edit by hand
#
# Install (append):  cat lichen.conf >> ~/.tmux.conf
#         (source):  tmux source-file lichen.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#0A0D0B,fg=#D8E0D4"
set -g status-left-style              "bg=#0A0D0B,fg=#708868"
set -g status-right-style             "bg=#0A0D0B,fg=#708868"
set -g status-left                    "#[fg=#759075,bold] #S #[fg=#708868,nobold]"
set -g status-right                   "#[fg=#708868] %H:%M #[fg=#759075]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#1C2A20"
set -g pane-active-border-style       "fg=#759075"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#1C2A20,fg=#759075"
set -g message-command-style          "bg=#1C2A20,fg=#90B878"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#759075,fg=#0A0D0B"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#708868"
set -g window-status-current-style    "fg=#759075,bold"
set -g window-status-bell-style       "fg=#C07060,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#90B878"
set -g popup-border-lines             "rounded"
