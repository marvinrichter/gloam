# damson — Alacritty color theme
# Generated from damson.json — do not edit by hand
#
# Install: copy this file to ~/.config/alacritty/themes/damson.toml
# then add `import = ["~/.config/alacritty/themes/damson.toml"]` to alacritty.toml

[colors.primary]
background = "#090610"
foreground = "#E8D8F8"

[colors.cursor]
cursor = "#D428BC"
text   = "#090610"

[colors.selection]
background = "#201030"
