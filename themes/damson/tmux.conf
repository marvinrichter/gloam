# Damson — tmux color snippet
# Generated from damson.json — do not edit by hand
#
# Install (append):  cat damson.conf >> ~/.tmux.conf
#         (source):  tmux source-file damson.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#090610,fg=#E8D8F8"
set -g status-left-style              "bg=#090610,fg=#887898"
set -g status-right-style             "bg=#090610,fg=#887898"
set -g status-left                    "#[fg=#D428BC,bold] #S #[fg=#887898,nobold]"
set -g status-right                   "#[fg=#887898] %H:%M #[fg=#D428BC]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#382848"
set -g pane-active-border-style       "fg=#D428BC"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#382848,fg=#D428BC"
set -g message-command-style          "bg=#382848,fg=#FF60D8"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#D428BC,fg=#090610"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#887898"
set -g window-status-current-style    "fg=#D428BC,bold"
set -g window-status-bell-style       "fg=#C86060,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#FF60D8"
set -g popup-border-lines             "rounded"
