# Noir — tmux color snippet
# Generated from noir.json — do not edit by hand
#
# Install (append):  cat noir.conf >> ~/.tmux.conf
#         (source):  tmux source-file noir.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#0A0A0A,fg=#E8E0D0"
set -g status-left-style              "bg=#0A0A0A,fg=#909090"
set -g status-right-style             "bg=#0A0A0A,fg=#909090"
set -g status-left                    "#[fg=#E8D080,bold] #S #[fg=#909090,nobold]"
set -g status-right                   "#[fg=#909090] %H:%M #[fg=#E8D080]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#1A1A1A"
set -g pane-active-border-style       "fg=#E8D080"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#1A1A1A,fg=#E8D080"
set -g message-command-style          "bg=#1A1A1A,fg=#E89048"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#E8D080,fg=#0A0A0A"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#909090"
set -g window-status-current-style    "fg=#E8D080,bold"
set -g window-status-bell-style       "fg=#D05050,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#E89048"
set -g popup-border-lines             "rounded"
