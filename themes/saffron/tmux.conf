# Saffron — tmux color snippet
# Generated from saffron.json — do not edit by hand
#
# Install (append):  cat saffron.conf >> ~/.tmux.conf
#         (source):  tmux source-file saffron.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#FAF0D8,fg=#281808"
set -g status-left-style              "bg=#FAF0D8,fg=#806040"
set -g status-right-style             "bg=#FAF0D8,fg=#806040"
set -g status-left                    "#[fg=#5E3008,bold] #S #[fg=#806040,nobold]"
set -g status-right                   "#[fg=#806040] %H:%M #[fg=#5E3008]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#503C28"
set -g pane-active-border-style       "fg=#5E3008"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#503C28,fg=#5E3008"
set -g message-command-style          "bg=#503C28,fg=#3A2880"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#5E3008,fg=#FAF0D8"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#806040"
set -g window-status-current-style    "fg=#5E3008,bold"
set -g window-status-bell-style       "fg=#802028,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#3A2880"
set -g popup-border-lines             "rounded"
