# Synthwave — tmux color snippet
# Generated from synthwave.json — do not edit by hand
#
# Install (append):  cat synthwave.conf >> ~/.tmux.conf
#         (source):  tmux source-file synthwave.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#0D0818,fg=#F0E8FF"
set -g status-left-style              "bg=#0D0818,fg=#9070C8"
set -g status-right-style             "bg=#0D0818,fg=#9070C8"
set -g status-left                    "#[fg=#FF60C8,bold] #S #[fg=#9070C8,nobold]"
set -g status-right                   "#[fg=#9070C8] %H:%M #[fg=#FF60C8]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#281848"
set -g pane-active-border-style       "fg=#FF60C8"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#281848,fg=#FF60C8"
set -g message-command-style          "bg=#281848,fg=#40E8E0"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#FF60C8,fg=#0D0818"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#9070C8"
set -g window-status-current-style    "fg=#FF60C8,bold"
set -g window-status-bell-style       "fg=#FF4070,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#40E8E0"
set -g popup-border-lines             "rounded"
