# Brume — tmux color snippet
# Generated from brume.json — do not edit by hand
#
# Install (append):  cat brume.conf >> ~/.tmux.conf
#         (source):  tmux source-file brume.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#EEF2F0,fg=#1C3030"
set -g status-left-style              "bg=#EEF2F0,fg=#486878"
set -g status-right-style             "bg=#EEF2F0,fg=#486878"
set -g status-left                    "#[fg=#1A6068,bold] #S #[fg=#486878,nobold]"
set -g status-right                   "#[fg=#486878] %H:%M #[fg=#1A6068]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#B8C8C8"
set -g pane-active-border-style       "fg=#1A6068"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#B8C8C8,fg=#1A6068"
set -g message-command-style          "bg=#B8C8C8,fg=#1A7880"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#1A6068,fg=#EEF2F0"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#486878"
set -g window-status-current-style    "fg=#1A6068,bold"
set -g window-status-bell-style       "fg=#8A1A28,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#1A7880"
set -g popup-border-lines             "rounded"
