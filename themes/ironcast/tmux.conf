# Ironcast — tmux color snippet
# Generated from ironcast.json — do not edit by hand
#
# Install (append):  cat ironcast.conf >> ~/.tmux.conf
#         (source):  tmux source-file ironcast.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#0B0D10,fg=#CDD4DC"
set -g status-left-style              "bg=#0B0D10,fg=#7090A8"
set -g status-right-style             "bg=#0B0D10,fg=#7090A8"
set -g status-left                    "#[fg=#78A8C8,bold] #S #[fg=#7090A8,nobold]"
set -g status-right                   "#[fg=#7090A8] %H:%M #[fg=#78A8C8]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#1C2028"
set -g pane-active-border-style       "fg=#78A8C8"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#1C2028,fg=#78A8C8"
set -g message-command-style          "bg=#1C2028,fg=#C8D838"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#78A8C8,fg=#0B0D10"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#7090A8"
set -g window-status-current-style    "fg=#78A8C8,bold"
set -g window-status-bell-style       "fg=#D05858,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#C8D838"
set -g popup-border-lines             "rounded"
