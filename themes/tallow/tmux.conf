# Tallow — tmux color snippet
# Generated from tallow.json — do not edit by hand
#
# Install (append):  cat tallow.conf >> ~/.tmux.conf
#         (source):  tmux source-file tallow.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#120E08,fg=#F0E8D8"
set -g status-left-style              "bg=#120E08,fg=#9A8870"
set -g status-right-style             "bg=#120E08,fg=#9A8870"
set -g status-left                    "#[fg=#E8C888,bold] #S #[fg=#9A8870,nobold]"
set -g status-right                   "#[fg=#9A8870] %H:%M #[fg=#E8C888]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#282018"
set -g pane-active-border-style       "fg=#E8C888"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#282018,fg=#E8C888"
set -g message-command-style          "bg=#282018,fg=#D4905A"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#E8C888,fg=#120E08"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#9A8870"
set -g window-status-current-style    "fg=#E8C888,bold"
set -g window-status-bell-style       "fg=#D86060,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#D4905A"
set -g popup-border-lines             "rounded"
