# Fern — tmux color snippet
# Generated from fern.json — do not edit by hand
#
# Install (append):  cat fern.conf >> ~/.tmux.conf
#         (source):  tmux source-file fern.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#EEF2EC,fg=#1A2E1A"
set -g status-left-style              "bg=#EEF2EC,fg=#4A5E50"
set -g status-right-style             "bg=#EEF2EC,fg=#4A5E50"
set -g status-left                    "#[fg=#1A4A2A,bold] #S #[fg=#4A5E50,nobold]"
set -g status-right                   "#[fg=#4A5E50] %H:%M #[fg=#1A4A2A]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#30403A"
set -g pane-active-border-style       "fg=#1A4A2A"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#30403A,fg=#1A4A2A"
set -g message-command-style          "bg=#30403A,fg=#604A10"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#1A4A2A,fg=#EEF2EC"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#4A5E50"
set -g window-status-current-style    "fg=#1A4A2A,bold"
set -g window-status-bell-style       "fg=#6A1818,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#604A10"
set -g popup-border-lines             "rounded"
