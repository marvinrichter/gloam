# Graphite — tmux color snippet
# Generated from graphite.json — do not edit by hand
#
# Install (append):  cat graphite.conf >> ~/.tmux.conf
#         (source):  tmux source-file graphite.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#0C0C0C,fg=#E0E0E0"
set -g status-left-style              "bg=#0C0C0C,fg=#808888"
set -g status-right-style             "bg=#0C0C0C,fg=#808888"
set -g status-left                    "#[fg=#C4B8C8,bold] #S #[fg=#808888,nobold]"
set -g status-right                   "#[fg=#808888] %H:%M #[fg=#C4B8C8]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#202020"
set -g pane-active-border-style       "fg=#C4B8C8"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#202020,fg=#C4B8C8"
set -g message-command-style          "bg=#202020,fg=#D8C8A0"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#C4B8C8,fg=#0C0C0C"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#808888"
set -g window-status-current-style    "fg=#C4B8C8,bold"
set -g window-status-bell-style       "fg=#C86060,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#D8C8A0"
set -g popup-border-lines             "rounded"
