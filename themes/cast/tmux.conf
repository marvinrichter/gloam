# Cast — tmux color snippet
# Generated from cast.json — do not edit by hand
#
# Install (append):  cat cast.conf >> ~/.tmux.conf
#         (source):  tmux source-file cast.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#101010,fg=#C8C8C0"
set -g status-left-style              "bg=#101010,fg=#888880"
set -g status-right-style             "bg=#101010,fg=#888880"
set -g status-left                    "#[fg=#C8C060,bold] #S #[fg=#888880,nobold]"
set -g status-right                   "#[fg=#888880] %H:%M #[fg=#C8C060]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#202020"
set -g pane-active-border-style       "fg=#C8C060"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#202020,fg=#C8C060"
set -g message-command-style          "bg=#202020,fg=#D8C040"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#C8C060,fg=#101010"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#888880"
set -g window-status-current-style    "fg=#C8C060,bold"
set -g window-status-bell-style       "fg=#D85858,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#D8C040"
set -g popup-border-lines             "rounded"
