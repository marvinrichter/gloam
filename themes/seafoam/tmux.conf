# Seafoam — tmux color snippet
# Generated from seafoam.json — do not edit by hand
#
# Install (append):  cat seafoam.conf >> ~/.tmux.conf
#         (source):  tmux source-file seafoam.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#EEF5F2,fg=#101E18"
set -g status-left-style              "bg=#EEF5F2,fg=#406060"
set -g status-right-style             "bg=#EEF5F2,fg=#406060"
set -g status-left                    "#[fg=#1A7858,bold] #S #[fg=#406060,nobold]"
set -g status-right                   "#[fg=#406060] %H:%M #[fg=#1A7858]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#C0D8D0"
set -g pane-active-border-style       "fg=#1A7858"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#C0D8D0,fg=#1A7858"
set -g message-command-style          "bg=#C0D8D0,fg=#166870"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#1A7858,fg=#EEF5F2"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#406060"
set -g window-status-current-style    "fg=#1A7858,bold"
set -g window-status-bell-style       "fg=#C83820,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#166870"
set -g popup-border-lines             "rounded"
