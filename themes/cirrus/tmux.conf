# Cirrus — tmux color snippet
# Generated from cirrus.json — do not edit by hand
#
# Install (append):  cat cirrus.conf >> ~/.tmux.conf
#         (source):  tmux source-file cirrus.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#EEF1F6,fg=#181C28"
set -g status-left-style              "bg=#EEF1F6,fg=#506098"
set -g status-right-style             "bg=#EEF1F6,fg=#506098"
set -g status-left                    "#[fg=#1E4888,bold] #S #[fg=#506098,nobold]"
set -g status-right                   "#[fg=#506098] %H:%M #[fg=#1E4888]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#505870"
set -g pane-active-border-style       "fg=#1E4888"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#505870,fg=#1E4888"
set -g message-command-style          "bg=#505870,fg=#1A7060"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#1E4888,fg=#EEF1F6"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#506098"
set -g window-status-current-style    "fg=#1E4888,bold"
set -g window-status-bell-style       "fg=#882028,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#1A7060"
set -g popup-border-lines             "rounded"
