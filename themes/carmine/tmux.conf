# Carmine — tmux color snippet
# Generated from carmine.json — do not edit by hand
#
# Install (append):  cat carmine.conf >> ~/.tmux.conf
#         (source):  tmux source-file carmine.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#100808,fg=#F2E4E0"
set -g status-left-style              "bg=#100808,fg=#9A7880"
set -g status-right-style             "bg=#100808,fg=#9A7880"
set -g status-left                    "#[fg=#E87070,bold] #S #[fg=#9A7880,nobold]"
set -g status-right                   "#[fg=#9A7880] %H:%M #[fg=#E87070]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#2A1818"
set -g pane-active-border-style       "fg=#E87070"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#2A1818,fg=#E87070"
set -g message-command-style          "bg=#2A1818,fg=#FFAA70"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#E87070,fg=#100808"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#9A7880"
set -g window-status-current-style    "fg=#E87070,bold"
set -g window-status-bell-style       "fg=#FF4A4A,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#FFAA70"
set -g popup-border-lines             "rounded"
