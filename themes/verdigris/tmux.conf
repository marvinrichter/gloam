# Verdigris — tmux color snippet
# Generated from verdigris.json — do not edit by hand
#
# Install (append):  cat verdigris.conf >> ~/.tmux.conf
#         (source):  tmux source-file verdigris.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#0D1210,fg=#D4E0D8"
set -g status-left-style              "bg=#0D1210,fg=#7A9490"
set -g status-right-style             "bg=#0D1210,fg=#7A9490"
set -g status-left                    "#[fg=#52C4A8,bold] #S #[fg=#7A9490,nobold]"
set -g status-right                   "#[fg=#7A9490] %H:%M #[fg=#52C4A8]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#1A2820"
set -g pane-active-border-style       "fg=#52C4A8"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#1A2820,fg=#52C4A8"
set -g message-command-style          "bg=#1A2820,fg=#CD8B4A"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#52C4A8,fg=#0D1210"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#7A9490"
set -g window-status-current-style    "fg=#52C4A8,bold"
set -g window-status-bell-style       "fg=#D46060,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#CD8B4A"
set -g popup-border-lines             "rounded"
