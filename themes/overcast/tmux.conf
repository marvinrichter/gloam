# Overcast — tmux color snippet
# Generated from overcast.json — do not edit by hand
#
# Install (append):  cat overcast.conf >> ~/.tmux.conf
#         (source):  tmux source-file overcast.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#F0F2F5,fg=#181C28"
set -g status-left-style              "bg=#F0F2F5,fg=#505870"
set -g status-right-style             "bg=#F0F2F5,fg=#505870"
set -g status-left                    "#[fg=#4040C8,bold] #S #[fg=#505870,nobold]"
set -g status-right                   "#[fg=#505870] %H:%M #[fg=#4040C8]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#C8CDD8"
set -g pane-active-border-style       "fg=#4040C8"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#C8CDD8,fg=#4040C8"
set -g message-command-style          "bg=#C8CDD8,fg=#3060C8"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#4040C8,fg=#F0F2F5"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#505870"
set -g window-status-current-style    "fg=#4040C8,bold"
set -g window-status-bell-style       "fg=#C02030,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#3060C8"
set -g popup-border-lines             "rounded"
