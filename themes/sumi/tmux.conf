# Sumi — tmux color snippet
# Generated from sumi.json — do not edit by hand
#
# Install (append):  cat sumi.conf >> ~/.tmux.conf
#         (source):  tmux source-file sumi.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#0A0B0D,fg=#D8D0C0"
set -g status-left-style              "bg=#0A0B0D,fg=#788090"
set -g status-right-style             "bg=#0A0B0D,fg=#788090"
set -g status-left                    "#[fg=#8878C8,bold] #S #[fg=#788090,nobold]"
set -g status-right                   "#[fg=#788090] %H:%M #[fg=#8878C8]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#202428"
set -g pane-active-border-style       "fg=#8878C8"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#202428,fg=#8878C8"
set -g message-command-style          "bg=#202428,fg=#7898B8"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#8878C8,fg=#0A0B0D"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#788090"
set -g window-status-current-style    "fg=#8878C8,bold"
set -g window-status-bell-style       "fg=#B86868,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#7898B8"
set -g popup-border-lines             "rounded"
