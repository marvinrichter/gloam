# Canopy — tmux color snippet
# Generated from canopy.json — do not edit by hand
#
# Install (append):  cat canopy.conf >> ~/.tmux.conf
#         (source):  tmux source-file canopy.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#080E0A,fg=#D4E0C8"
set -g status-left-style              "bg=#080E0A,fg=#709068"
set -g status-right-style             "bg=#080E0A,fg=#709068"
set -g status-left                    "#[fg=#90C860,bold] #S #[fg=#709068,nobold]"
set -g status-right                   "#[fg=#709068] %H:%M #[fg=#90C860]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#182018"
set -g pane-active-border-style       "fg=#90C860"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#182018,fg=#90C860"
set -g message-command-style          "bg=#182018,fg=#C8A060"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#90C860,fg=#080E0A"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#709068"
set -g window-status-current-style    "fg=#90C860,bold"
set -g window-status-bell-style       "fg=#D06868,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#C8A060"
set -g popup-border-lines             "rounded"
