# Wisteria — tmux color snippet
# Generated from wisteria.json — do not edit by hand
#
# Install (append):  cat wisteria.conf >> ~/.tmux.conf
#         (source):  tmux source-file wisteria.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#F4F0F8,fg=#2A1A40"
set -g status-left-style              "bg=#F4F0F8,fg=#4A3868"
set -g status-right-style             "bg=#F4F0F8,fg=#4A3868"
set -g status-left                    "#[fg=#4828A0,bold] #S #[fg=#4A3868,nobold]"
set -g status-right                   "#[fg=#4A3868] %H:%M #[fg=#4828A0]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#C8B8D8"
set -g pane-active-border-style       "fg=#4828A0"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#C8B8D8,fg=#4828A0"
set -g message-command-style          "bg=#C8B8D8,fg=#782870"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#4828A0,fg=#F4F0F8"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#4A3868"
set -g window-status-current-style    "fg=#4828A0,bold"
set -g window-status-bell-style       "fg=#882020,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#782870"
set -g popup-border-lines             "rounded"
