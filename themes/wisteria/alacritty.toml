# wisteria — Alacritty color theme
# Generated from wisteria.json — do not edit by hand
#
# Install: copy this file to ~/.config/alacritty/themes/wisteria.toml
# then add `import = ["~/.config/alacritty/themes/wisteria.toml"]` to alacritty.toml

[colors.primary]
background = "#F4F0F8"
foreground = "#2A1A40"

[colors.cursor]
cursor = "#4828A0"
text   = "#F4F0F8"

[colors.selection]
background = "#D8C8F0"
