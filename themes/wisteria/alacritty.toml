[colors.normal]
black   = "#F4F0F8"
red     = "#882020"
green   = "#1A5028"
yellow  = "#705010"
blue    = "#2A3888"
magenta = "#4828A0"
cyan    = "#286080"
white   = "#4A3868"

[colors.bright]
black   = "#C8B8D8"
red     = "#C04848"
green   = "#287840"
yellow  = "#906820"
blue    = "#3850B8"
