# Ochre — tmux color snippet
# Generated from ochre.json — do not edit by hand
#
# Install (append):  cat ochre.conf >> ~/.tmux.conf
#         (source):  tmux source-file ochre.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#F2E4D0,fg=#220E08"
set -g status-left-style              "bg=#F2E4D0,fg=#705040"
set -g status-right-style             "bg=#F2E4D0,fg=#705040"
set -g status-left                    "#[fg=#722018,bold] #S #[fg=#705040,nobold]"
set -g status-right                   "#[fg=#705040] %H:%M #[fg=#722018]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#4A3020"
set -g pane-active-border-style       "fg=#722018"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#4A3020,fg=#722018"
set -g message-command-style          "bg=#4A3020,fg=#1A6068"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#722018,fg=#F2E4D0"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#705040"
set -g window-status-current-style    "fg=#722018,bold"
set -g window-status-bell-style       "fg=#7A1828,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#1A6068"
set -g popup-border-lines             "rounded"
