# Iris — tmux color snippet
# Generated from iris.json — do not edit by hand
#
# Install (append):  cat iris.conf >> ~/.tmux.conf
#         (source):  tmux source-file iris.conf
# Reload:            tmux source-file ~/.tmux.conf

# ── Status bar ──────────────────────────────────────────────────────────────

set -g status-style                   "bg=#08060E,fg=#E0D8F8"
set -g status-left-style              "bg=#08060E,fg=#8070B0"
set -g status-right-style             "bg=#08060E,fg=#8070B0"
set -g status-left                    "#[fg=#9060E0,bold] #S #[fg=#8070B0,nobold]"
set -g status-right                   "#[fg=#8070B0] %H:%M #[fg=#9060E0]#H "

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-style              "fg=#281838"
set -g pane-active-border-style       "fg=#9060E0"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style                  "bg=#281838,fg=#9060E0"
set -g message-command-style          "bg=#281838,fg=#B088F8"

# ── Selection / copy mode ────────────────────────────────────────────────────

set -g mode-style                     "bg=#9060E0,fg=#08060E"

# ── Window list ──────────────────────────────────────────────────────────────

set -g window-status-style            "fg=#8070B0"
set -g window-status-current-style    "fg=#9060E0,bold"
set -g window-status-bell-style       "fg=#D06868,bold"
set -g window-status-format          " #I:#W "
set -g window-status-current-format  " #I:#W "

# ── Popup windows ────────────────────────────────────────────────────────────

set -g popup-border-style             "fg=#B088F8"
set -g popup-border-lines             "rounded"
