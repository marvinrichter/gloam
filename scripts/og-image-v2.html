<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gloam — og:image composer v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      background-color: #0F0E0C; /* neutral-950 fallback */
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 64px 80px;
    }

    .bg {
      position: absolute;
      inset: 0;
      background-image: url('../docs/assets/og-bg-2.jpg');
      background-size: cover;
      background-position: center;
    }

    /* Gradient overlay: slightly stronger mid-stop for the warmer image
       — prevents amber tones from competing with the wordmark color */
    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        160deg,
        rgba(15, 14, 12, 0.35) 0%,
        rgba(15, 14, 12, 0.60) 40%,
        rgba(15, 14, 12, 0.88) 100%
      );
    }

    .content {
      position: relative;
      z-index: 1;
    }

    /* Horizon rule — brand "Mark" element */
    .rule {
      width: 200px;
      height: 1px;
      background: linear-gradient(90deg, #C4894A, transparent);
      margin-bottom: 28px;
      opacity: 0.6;
    }

    .wordmark {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 96px;
      font-weight: 300;
      font-style: normal;
      font-variation-settings: 'opsz' 144;
      letter-spacing: -0.02em;
      line-height: 1;
      color: #C4894A; /* primary-500 */
      margin-bottom: 20px;
    }

    .tagline {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 22px;
      font-weight: 300;
      font-style: italic;
      font-variation-settings: 'opsz' 72;
      letter-spacing: 0.01em;
      color: #9A9693; /* neutral-400 */
      line-height: 1.4;
    }

    .dot-strip {
      position: absolute;
      top: 56px;
      right: 72px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      width: 200px;
      justify-content: flex-end;
      z-index: 1;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      opacity: 0.75;
    }

    .dot-group {
      display: flex;
      gap: 4px;
    }

    .stats {
      position: absolute;
      bottom: 64px;
      right: 80px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      z-index: 1;
    }

    .stat {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 11px;
      font-weight: 300;
      font-variation-settings: 'opsz' 20;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #585350; /* neutral-600 */
    }

    .stat b {
      color: #D09A68; /* primary-400 */
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- Background image + overlay -->
    <div class="bg"></div>

    <!-- Theme dot strip (top right) -->
    <div class="dot-strip">
      <!-- Eventide -->
      <div class="dot-group">
        <div class="dot" style="background:#E8B86D"></div>
        <div class="dot" style="background:#FF7F57"></div>
        <div class="dot" style="background:#8B84C4"></div>
        <div class="dot" style="background:#E85D5D"></div>
      </div>
      <!-- Aether -->
      <div class="dot-group">
        <div class="dot" style="background:#5EE8B8"></div>
        <div class="dot" style="background:#C084FC"></div>
        <div class="dot" style="background:#8886B0"></div>
        <div class="dot" style="background:#FF6B6B"></div>
      </div>
      <!-- Ember -->
      <div class="dot-group">
        <div class="dot" style="background:#FFAB40"></div>
        <div class="dot" style="background:#FF6D00"></div>
        <div class="dot" style="background:#9E8E78"></div>
        <div class="dot" style="background:#FF4040"></div>
      </div>
      <!-- Absinthe -->
      <div class="dot-group">
        <div class="dot" style="background:#70E0A0"></div>
        <div class="dot" style="background:#E8C848"></div>
        <div class="dot" style="background:#7A8A7A"></div>
        <div class="dot" style="background:#E05858"></div>
      </div>
      <!-- Verdigris -->
      <div class="dot-group">
        <div class="dot" style="background:#52C4A8"></div>
        <div class="dot" style="background:#CD8B4A"></div>
        <div class="dot" style="background:#7A9490"></div>
        <div class="dot" style="background:#D46060"></div>
      </div>
      <!-- Sable -->
      <div class="dot-group">
        <div class="dot" style="background:#C0C8D4"></div>
        <div class="dot" style="background:#D4AA6A"></div>
        <div class="dot" style="background:#7A8294"></div>
        <div class="dot" style="background:#D44848"></div>
      </div>
      <!-- Fjord -->
      <div class="dot-group">
        <div class="dot" style="background:#6EB5E0"></div>
        <div class="dot" style="background:#E8C46A"></div>
        <div class="dot" style="background:#688EAA"></div>
        <div class="dot" style="background:#E06060"></div>
      </div>
      <!-- Umbra -->
      <div class="dot-group">
        <div class="dot" style="background:#A0B4C8"></div>
        <div class="dot" style="background:#8B6CF0"></div>
        <div class="dot" style="background:#728090"></div>
        <div class="dot" style="background:#DC5858"></div>
      </div>
      <!-- Cordovan -->
      <div class="dot-group">
        <div class="dot" style="background:#C49A6A"></div>
        <div class="dot" style="background:#6B9AB8"></div>
        <div class="dot" style="background:#9A7D6A"></div>
        <div class="dot" style="background:#D06060"></div>
      </div>
      <!-- Tungsten -->
      <div class="dot-group">
        <div class="dot" style="background:#F0D890"></div>
        <div class="dot" style="background:#5A90C8"></div>
        <div class="dot" style="background:#887A60"></div>
        <div class="dot" style="background:#E05858"></div>
      </div>
      <!-- Amethyst -->
      <div class="dot-group">
        <div class="dot" style="background:#C084F0"></div>
        <div class="dot" style="background:#E8B84A"></div>
        <div class="dot" style="background:#9080A8"></div>
        <div class="dot" style="background:#E05858"></div>
      </div>
      <!-- Parchment -->
      <div class="dot-group">
        <div class="dot" style="background:#4A2E12"></div>
        <div class="dot" style="background:#7A3A10"></div>
        <div class="dot" style="background:#6B5A48"></div>
        <div class="dot" style="background:#8B2020"></div>
      </div>
    </div>

    <!-- Wordmark + tagline (bottom left) -->
    <div class="content">
      <div class="rule"></div>
      <div class="wordmark">gloam</div>
      <div class="tagline">Twelve atmospheres. Each one complete.</div>
    </div>

    <!-- Stats (bottom right) -->
    <div class="stats">
      <span class="stat"><b>12</b> themes</span>
      <span class="stat"><b>11</b> formats</span>
      <span class="stat">WCAG <b>AA</b></span>
    </div>

  </div>
</body>
</html>
