name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run tests
        run: npm test -- --coverage-reporters=text-summary --coverage-lines=85 --coverage-branches=80 --coverage-functions=85

      - name: Verify generator output is up to date
        run: |
          npm run generate
          git diff --exit-code -- themes/ || {
            echo "Generated files are out of date. Run 'npm run generate' and commit the result."
            exit 1
          }
