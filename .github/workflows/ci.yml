name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Verify generator output is up to date
        run: |
          npm run generate
          git diff --exit-code -- themes/ || {
            echo "Generated files are out of date. Run 'npm run generate' and commit the result."
            exit 1
          }
