name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Validate theme JSON schemas
        run: npm run validate-schemas

      - name: Validate theme output completeness
        run: npm run validate-completeness

      - name: WCAG AA contrast gate
        run: npm run check-contrast

      - name: Run tests
        timeout-minutes: 5
        run: |
          set -o pipefail
          npm test -- --test-reporter=spec 2>&1 | tee /tmp/test-output.txt

      # Post a coverage summary comment on PRs — runs once (ubuntu / node 22 only)
      - name: Post coverage comment
        if: >
          github.event_name == 'pull_request' &&
          matrix.os == 'ubuntu-latest' &&
          matrix.node-version == 22
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/ci/coverage-comment.js /tmp/test-output.txt > /tmp/coverage-comment.md

          # Update the existing bot comment if one exists; otherwise create a new one
          EXISTING=$(gh api \
            repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("## 📊 Test Coverage"))) | .id' \
            | head -1)

          if [ -n "$EXISTING" ]; then
            gh api repos/${{ github.repository }}/issues/comments/"$EXISTING" \
              -X PATCH \
              --field body="$(cat /tmp/coverage-comment.md)"
          else
            gh pr comment ${{ github.event.pull_request.number }} \
              --body-file /tmp/coverage-comment.md
          fi

  generate-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Verify generator output is up to date
        run: |
          npm run generate
          git diff --exit-code -- themes/ || {
            echo "Generated files are out of date. Run 'npm run generate' and commit the result."
            exit 1
          }

  gate:
    # One name a branch rule can require. `needs` alone does not carry the
    # result: a job whose dependency failed is skipped, and GitHub counts a
    # skipped required check as passing. So the result is asserted here.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    needs: [test, generate-check]
    steps:
      - name: Assert every upstream job succeeded
        run: |
          printf 'test=%s generate-check=%s\n' \
            '${{ needs.test.result }}' '${{ needs.generate-check.result }}'
          [ '${{ needs.test.result }}' = success ] || exit 1
          [ '${{ needs.generate-check.result }}' = success ] || exit 1
