name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # NOTE: macOS is the primary user platform for gloam but is not tested in CI.
    # The generator is pure Node.js with no platform-specific code, so ubuntu-latest
    # is representative. Add macos-latest to the matrix if installer path logic
    # (e.g. homedir resolution) ever requires macOS-specific testing.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Verify generator output is up to date
        run: |
          npm run generate
          git diff --exit-code -- themes/ || {
            echo "Generated files are out of date. Run 'npm run generate' and commit the result."
            exit 1
          }
